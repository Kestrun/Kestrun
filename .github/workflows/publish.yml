name: Publish Release

permissions:
    contents: read # read release & assets
    packages: write # publish to GitHub Packages (NuGet)
    pull-requests: read # optional (kept from original, can remove if not needed)

on:
    workflow_dispatch:
        inputs:
            publish_mode:
                description: "Perform real publish or rehearsal"
                type: choice
                options: [rehearsal, real]
                default: rehearsal
            publish_targets:
                description: "Targets to publish (comma-separated: psgallery, nuget, github)"
                required: true
                default: "psgallery,nuget,github"

env:
    PUBLISH_MODE: ${{ inputs.publish_mode }}
    TARGETS: ${{ inputs.publish_targets }}

jobs:
    gate:
        name: Validate Release Assets
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.semver.outputs.tag }}
            norm_targets: ${{ steps.norm.outputs.norm_targets }}
            publish_mode: ${{ steps.norm.outputs.publish_mode }}
        steps:
            - name: 🛎️ Checkout (for version.json)
              uses: actions/checkout@v7.0.0
              with:
                  fetch-depth: 1

            - name: Compute tag from version.json
              id: semver
              shell: pwsh
              run: |
                  $j = Get-Content version.json -Raw | ConvertFrom-Json
                  $version   = [string]$j.Version
                  $release   = [string]$j.Release
                  $iteration = [string]$j.Iteration
                  if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be x.y.z; got '$version'" }
                  $pre = if ($release -match '^(Alpha|Beta|RC)$') { ($release.ToLower()) + ($(if ($iteration){$iteration}else{'1'})) } else { $null }
                  $tag = if ($pre) { "v$version-$pre" } else { "v$version" }
                  "tag=$tag"           >> $env:GITHUB_OUTPUT
                  "version=$version"   >> $env:GITHUB_OUTPUT
                  "prerelease=$([bool]$pre)" >> $env:GITHUB_OUTPUT

            - name: 🧪 Normalize & Echo Inputs
              id: norm
              run: |
                  set -e
                  TAG='${{ steps.semver.outputs.tag }}'
                  echo "Resolved tag: $TAG"
                  # Normalize targets: lowercase, strip spaces
                  NORM_TARGETS=$(echo "${TARGETS}" | tr 'A-Z' 'a-z' | tr -d ' ' )
                  echo "Normalized targets: $NORM_TARGETS"
                  echo "norm_targets=$NORM_TARGETS" >> "$GITHUB_OUTPUT"
                  echo "Mode: $PUBLISH_MODE"
                  if [ "$PUBLISH_MODE" != "real" ] && [ "$PUBLISH_MODE" != "rehearsal" ]; then
                    echo "Invalid publish_mode: $PUBLISH_MODE"
                    exit 1
                  fi
                  echo "publish_mode=$PUBLISH_MODE" >> "$GITHUB_OUTPUT"

            - name: 📥 Fetch Release Metadata (gh api)
              id: relmeta
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  TAG='${{ steps.semver.outputs.tag }}'
                  echo "Fetching release info for ${TAG}"
                  DATA=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/${TAG} || true)
                  if [ -z "$DATA" ]; then
                    echo "Release with tag ${TAG} not found."
                    exit 1
                  fi
                  echo "$DATA" > release.json
                  echo "Downloaded release metadata:"
                  jq '.tag_name, .name, .draft, .prerelease' release.json
                  DRAFT=$(jq -r '.draft' release.json)
                  # Example enforcement (uncomment if desired):
                  # if [ "$DRAFT" = "true" ]; then
                  #   echo "Release is still a draft. Refusing to promote."
                  #   exit 1
                  # fi

            - name: 📥 Download Release Assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  TAG='${{ steps.semver.outputs.tag }}'
                  mkdir -p release-assets
                  gh release download "${TAG}" \
                     --repo "${GITHUB_REPOSITORY}" \
                     --dir release-assets \
                     --pattern "*"
                  echo "Downloaded assets:"
                  ls -l release-assets || true

            - name: ✅ Validate Required Assets (conditional by targets)
              run: |
                  set -e
                  TARGETS="${{ steps.norm.outputs.norm_targets }}"
                  fail=0
                  if echo "$TARGETS" | grep -q 'psgallery'; then
                    if ! ls release-assets/Kestrun-PSModule-*.zip >/dev/null 2>&1; then
                      echo "ERROR: Expected Kestrun-PSModule-*.zip for PowerShell Gallery."
                      fail=1
                    fi
                  fi
                  if echo "$TARGETS" | grep -q 'nuget'; then
                    if ! ls release-assets/*.nupkg >/dev/null 2>&1; then
                      echo "ERROR: Expected at least one .nupkg for NuGet.org."
                      fail=1
                    fi
                  fi
                    # .snupkg are optional but recommended
                  if [ $fail -ne 0 ]; then
                    echo "Validation failed."
                    exit 1
                  fi
                  echo "All required assets present."

    promote:
        name: Promote Release Artifacts
        runs-on: ubuntu-latest
        needs: gate
        permissions:
            contents: read
            packages: write
        env:
            TAG: ${{ needs.gate.outputs.tag }}
            TARGETS: ${{ needs.gate.outputs.norm_targets }}
            PUBLISH_MODE: ${{ needs.gate.outputs.publish_mode }}
        steps:
            - name: 🛎️ Checkout (lightweight)
              uses: actions/checkout@v7.0.0
              with:
                  fetch-depth: 1

            - name: 📥 Re-Download Release Assets (fresh workspace)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  mkdir -p release-assets
                  gh release download "${TAG}" \
                     --repo "${GITHUB_REPOSITORY}" \
                     --dir release-assets \
                     --pattern "*"
                  ls -l release-assets || true

            - name: 🧾 Show downloaded files
              run: ls -l release-assets

            - name: 🧰 Setup .NET (required for dotnet nuget push)
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            # ---------- PowerShell Gallery ----------
            - name: ⚙️ Prepare module for PSGallery (unzip *.psmodule.zip)
              if: contains(env.TARGETS, 'psgallery')
              shell: pwsh
              run: |
                  $zip = Get-ChildItem -Path "release-assets" -Filter "Kestrun-PSModule-*.zip" | Select-Object -First 1
                  if (-not $zip) { throw "No Kestrun-PSModule-*.zip found in release assets." }
                  New-Item -ItemType Directory -Force -Path ./stage/module | Out-Null
                  Expand-Archive -Path $zip.FullName -DestinationPath ./stage/module -Force
                  Get-ChildItem -Recurse ./stage/module | Select-Object -First 10 | Format-Table -Auto

            - name: 🚀 Publish to PowerShell Gallery (PSResourceGet)
              if: contains(env.TARGETS, 'psgallery')
              shell: pwsh
              env:
                  PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
              run: |
                  Import-Module Microsoft.PowerShell.PSResourceGet -Force
                  if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                    Register-PSResourceRepository -PSGallery
                  }
                  if (-not $env:PSGALLERY_API_KEY) { throw "Missing PSGALLERY_API_KEY" }
                  $path = Resolve-Path "./stage/module"

                  $manifest = Get-ChildItem -Path $path -Filter '*.psd1' -File | Select-Object -First 1
                  if (-not $manifest) { throw "No module manifest (*.psd1) found under $path" }

                  $moduleInfo = Test-ModuleManifest -Path $manifest.FullName
                  $moduleName = [string]$moduleInfo.Name
                  $baseVersion = [string]$moduleInfo.Version
                  $prereleaseLabel = [string]$moduleInfo.PrivateData.PSData.Prerelease
                  $moduleVersion = if ([string]::IsNullOrWhiteSpace($prereleaseLabel)) { $baseVersion } else { "$baseVersion-$prereleaseLabel" }

                  $existing = $null
                  $findParams = @{
                    Name = $moduleName
                    Version = $moduleVersion
                    Repository = 'PSGallery'
                    ErrorAction = 'SilentlyContinue'
                  }
                  if ($moduleVersion.Contains('-')) {
                    $findParams.Prerelease = $true
                  }
                  $existing = Find-PSResource @findParams

                  if ($existing) {
                    Write-Host "Skipping PSGallery publish: ${moduleName} ${moduleVersion} already exists."
                    return
                  }

                  if ($env:PUBLISH_MODE -eq 'real') {
                    Publish-PSResource -Path $path -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
                  } else {
                    Publish-PSResource -Path $path -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -WhatIf
                  }

            - name: 🔍 Validate NuGet package metadata (license compatibility)
              if: contains(env.TARGETS, 'nuget') || contains(env.TARGETS, 'github')
              run: |
                  set -euo pipefail
                  shopt -s nullglob

                  patched=0
                  for pkg in release-assets/*.nupkg; do
                    workdir=$(mktemp -d)
                    unzip -qq "$pkg" -d "$workdir"
                    nuspec=$(find "$workdir" -maxdepth 2 -name '*.nuspec' | head -n 1)

                    if [ -n "$nuspec" ] &&
                       grep -qi '<license[[:space:]]\+type="expression">MIT</license>' "$nuspec" &&
                       ! grep -qi '<licenseUrl>https://licenses.nuget.org/MIT</licenseUrl>' "$nuspec"; then
                      sed -i 's#<license[[:space:]]\+type="expression">MIT</license>#<license type="expression">MIT</license>\n    <licenseUrl>https://licenses.nuget.org/MIT</licenseUrl>#I' "$nuspec"
                      (cd "$workdir" && zip -qr "$OLDPWD/$pkg.fixed" .)
                      mv -f "$pkg.fixed" "$pkg"
                      echo "Patched missing licenseUrl in $pkg"
                      patched=$((patched + 1))
                    fi

                    rm -rf "$workdir"
                  done
                  echo "License metadata auto-patch count: $patched"

                  invalid=()
                  for pkg in release-assets/*.nupkg; do
                    nuspec=$(unzip -p "$pkg" '*.nuspec' || true)
                    if [ -z "$nuspec" ]; then
                      echo "ERROR: Could not read nuspec from $pkg"
                      invalid+=("$pkg (nuspec unreadable)")
                      continue
                    fi

                    has_license_expression=0
                    has_license_url=0
                    if echo "$nuspec" | grep -qi '<license[[:space:]]\+type="expression"'; then
                      has_license_expression=1
                    fi
                    if echo "$nuspec" | grep -qi '<licenseUrl>https://licenses.nuget.org/'; then
                      has_license_url=1
                    fi

                    if [ "$has_license_expression" -eq 1 ] && [ "$has_license_url" -eq 0 ]; then
                      invalid+=("$pkg")
                    fi
                  done

                  if [ ${#invalid[@]} -gt 0 ]; then
                    echo "ERROR: The following packages are missing legacy <licenseUrl> while using license expression:"
                    for bad in "${invalid[@]}"; do
                      echo " - $bad"
                    done
                    echo "Action required: regenerate and re-upload these .nupkg assets with licenseUrl set (for MIT: https://licenses.nuget.org/MIT)."
                    exit 1
                  fi

                  echo "NuGet metadata compatibility check passed."

            # ---------- NuGet.org ----------
            - name: 🚀 Publish to NuGet.org
              if: contains(env.TARGETS, 'nuget')
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
              run: |
                  set -uo pipefail
                  if [ "${PUBLISH_MODE}" = "real" ]; then
                    shopt -s nullglob
                    failures=()

                    get_nuspec_value() {
                      local package_path="$1"
                      local tag_name="$2"
                      unzip -p "$package_path" '*.nuspec' | sed -n "s:.*<$tag_name>\\(.*\\)</$tag_name>.*:\\1:p" | head -n 1
                    }

                    is_nuget_published() {
                      local package_id="$1"
                      local package_version="$2"
                      local id_lower
                      local version_lower
                      id_lower=$(echo "$package_id" | tr '[:upper:]' '[:lower:]')
                      version_lower=$(echo "$package_version" | tr '[:upper:]' '[:lower:]')
                      local package_url="https://api.nuget.org/v3-flatcontainer/${id_lower}/${version_lower}/${id_lower}.${version_lower}.nupkg"
                      curl -fsI "$package_url" >/dev/null
                    }

                    for pkg in release-assets/*.nupkg; do
                      package_id=$(get_nuspec_value "$pkg" id)
                      package_version=$(get_nuspec_value "$pkg" version)
                      if [ -z "$package_id" ] || [ -z "$package_version" ]; then
                        echo "ERROR: Could not read package metadata from $pkg"
                        failures+=("$pkg")
                        continue
                      fi

                      if is_nuget_published "$package_id" "$package_version"; then
                        echo "Skipping already published package on NuGet.org: ${package_id} ${package_version}"
                        continue
                      fi

                      echo "Pushing $pkg to NuGet.org"
                      if ! dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
                        echo "ERROR: Failed to push $pkg"
                        failures+=("$pkg")
                      fi
                    done

                    for sym in release-assets/*.snupkg; do
                      echo "Pushing $sym (symbols) to NuGet.org"
                      if ! dotnet nuget push "$sym" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
                        echo "ERROR: Failed to push symbol package $sym"
                        failures+=("$sym")
                      fi
                    done

                    if [ ${#failures[@]} -gt 0 ]; then
                      echo "The following packages failed to publish:"
                      for failed_pkg in "${failures[@]}"; do
                        echo " - $failed_pkg"
                      done
                      exit 1
                    fi
                  else
                    echo "Rehearsal: Would push .nupkg/.snupkg to NuGet.org"
                  fi

            # ---------- GitHub Packages (NuGet) ----------
            - name: 🚀 Publish to GitHub Packages (NuGet)
              if: contains(env.TARGETS, 'github')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  if [ "${PUBLISH_MODE}" = "real" ]; then
                    shopt -s nullglob
                    failures=()

                    get_nuspec_value() {
                      local package_path="$1"
                      local tag_name="$2"
                      unzip -p "$package_path" '*.nuspec' | sed -n "s:.*<$tag_name>\\(.*\\)</$tag_name>.*:\\1:p" | head -n 1
                    }

                    is_github_nuget_published() {
                      local package_id="$1"
                      local package_version="$2"
                      local package_name_encoded
                      local versions_json
                      package_name_encoded=$(jq -rn --arg name "$package_id" '$name|@uri')

                      versions_json=$(gh api \
                        --silent \
                        --method GET \
                        "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/nuget/${package_name_encoded}/versions?per_page=100" \
                        2>/dev/null || true)

                      if [ -z "$versions_json" ]; then
                        return 1
                      fi

                      echo "$versions_json" | jq -e --arg version "$package_version" '[.[] | .name | ascii_downcase] | index($version|ascii_downcase) != null' >/dev/null
                    }

                    for pkg in release-assets/*.nupkg; do
                      package_id=$(get_nuspec_value "$pkg" id)
                      package_version=$(get_nuspec_value "$pkg" version)
                      if [ -z "$package_id" ] || [ -z "$package_version" ]; then
                        echo "ERROR: Could not read package metadata from $pkg"
                        failures+=("$pkg")
                        continue
                      fi

                      if is_github_nuget_published "$package_id" "$package_version"; then
                        echo "Skipping already published package on GitHub Packages: ${package_id} ${package_version}"
                        continue
                      fi

                      echo "Pushing $pkg to GitHub Packages"
                      if ! dotnet nuget push "$pkg" \
                        --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
                        --api-key "${{ secrets.GITHUB_TOKEN }}" \
                        --skip-duplicate; then
                        echo "ERROR: Failed to push $pkg to GitHub Packages"
                        failures+=("$pkg")
                      fi
                    done
                    for sym in release-assets/*.snupkg; do
                      echo "Pushing $sym (symbols) to GitHub Packages"
                      if ! dotnet nuget push "$sym" \
                        --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
                        --api-key "${{ secrets.GITHUB_TOKEN }}" \
                        --skip-duplicate; then
                        echo "ERROR: Failed to push symbol package $sym to GitHub Packages"
                        failures+=("$sym")
                      fi
                    done

                    if [ ${#failures[@]} -gt 0 ]; then
                      echo "The following GitHub Packages publishes failed:"
                      for failed_pkg in "${failures[@]}"; do
                        echo " - $failed_pkg"
                      done
                      exit 1
                    fi
                  else
                    echo "Rehearsal: Would push .nupkg/.snupkg to GitHub Packages"
                  fi
