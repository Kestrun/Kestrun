permissions:
    contents: read
    pull-requests: read

name: CI (PR)

on:
    pull_request:
        paths:
            - src/**/*.cs
            - src/**/*.csproj
            - src/**/*.sln
            - src/**/*.ps1
            - src/**/*.psm1
            - src/**/*.psd1

jobs:
    ci:
        uses: Kestrun/Kestrun/.github/workflows/ci-core.yml@main
        with:
            is_pr: true
        secrets:
            UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
